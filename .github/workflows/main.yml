# Managed by the @ghostry meta repo (.templates/workflows/generate.ts). Edit it
# there and run `bun .scripts/sync.ts`; changes made here are overwritten.
##
# Changing a package's version in a commit to main publishes it under that
# version. The GitHub release is created with an empty body; notes are written
# afterwards with the meta repo's release-notes skill.
#
# This file's name matters: each package's npm trusted publisher names
# `main.yml`, since npm checks the calling workflow, not `publish.yml`.
#
name: Build, Test, and Release

on:
  push:
    branches:
      - main

jobs:
  build-extern:
    name: Build `extern`
    uses: ./.github/workflows/build.yml
    with:
      package: extern
      path: pkg/extern

  test-extern:
    name: Test `extern`
    uses: ./.github/workflows/test.yml
    needs: [build-extern]
    permissions:
      actions: read
    with:
      package: extern
      path: pkg/extern
      build-run-id: ${{ needs.build-extern.outputs.run-id }}

  build-extern-extension-fabricator-v0:
    name: Build `extern-extension-fabricator-v0`
    uses: ./.github/workflows/build.yml
    needs: [build-extern]
    with:
      package: extern-extension-fabricator-v0
      path: pkg/extern-extension-fabricator-v0

  test-extern-extension-fabricator-v0:
    name: Test `extern-extension-fabricator-v0`
    uses: ./.github/workflows/test.yml
    needs: [build-extern-extension-fabricator-v0]
    permissions:
      actions: read
    with:
      package: extern-extension-fabricator-v0
      path: pkg/extern-extension-fabricator-v0
      build-run-id: ${{ needs.build-extern-extension-fabricator-v0.outputs.run-id }}

  version-extern:
    name: Check for a release (`extern`)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version and look for its release
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version pkg/extern/package.json)"
          tag="extern/$version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "Release $tag already exists? $exists"
          echo "exists=$exists" >> $GITHUB_OUTPUT

  version-extern-extension-fabricator-v0:
    name: Check for a release (`extern-extension-fabricator-v0`)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version and look for its release
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version pkg/extern-extension-fabricator-v0/package.json)"
          tag="extern-extension-fabricator-v0/$version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "Release $tag already exists? $exists"
          echo "exists=$exists" >> $GITHUB_OUTPUT

  ##
  # A package that depends on another package in this repo publishes after it.
  # Its dependency range may have a lower bound equal to the version this same
  # push releases, and JSR resolves that range against npm when it publishes.
  # `publish.yml` ends only once the new version is visible on npm.
  #
  # A job whose `needs` was skipped is skipped too, unless its `if` says
  # otherwise, and a dependency's publish is skipped whenever it has no new
  # version. `!cancelled() && !failure()` replaces the implicit `success()`:
  # it still runs after a skipped publish, and still stops after a failed
  # build, test, or publish.
  ##

  publish-extern:
    name: Publish (`extern`)
    if: ${{ needs.version-extern.outputs.exists == 'false' }}
    uses: ./.github/workflows/publish.yml
    needs:
      - build-extern
      - test-extern
      - version-extern
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    with:
      package: extern
      path: pkg/extern
      version: ${{ needs.version-extern.outputs.version }}
      tag: ${{ needs.version-extern.outputs.tag }}
      release-name: extern ${{ needs.version-extern.outputs.version }}
      build-run-id: ${{ needs.build-extern.outputs.run-id }}

  publish-extern-extension-fabricator-v0:
    name: Publish (`extern-extension-fabricator-v0`)
    if: ${{ !cancelled() && !failure() && needs.version-extern-extension-fabricator-v0.outputs.exists == 'false' }}
    uses: ./.github/workflows/publish.yml
    needs:
      - build-extern-extension-fabricator-v0
      - test-extern-extension-fabricator-v0
      - version-extern-extension-fabricator-v0
      - publish-extern
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    with:
      package: extern-extension-fabricator-v0
      path: pkg/extern-extension-fabricator-v0
      version: ${{ needs.version-extern-extension-fabricator-v0.outputs.version }}
      tag: ${{ needs.version-extern-extension-fabricator-v0.outputs.tag }}
      release-name: extern-extension-fabricator-v0 ${{ needs.version-extern-extension-fabricator-v0.outputs.version }}
      build-run-id: ${{ needs.build-extern-extension-fabricator-v0.outputs.run-id }}
