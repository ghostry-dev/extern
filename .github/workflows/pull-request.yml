# Managed by the @ghostry meta repo (.templates/workflows/generate.ts). Edit it
# there and run `bun .scripts/sync.ts`; changes made here are overwritten.
name: Build and Test

on:
  pull_request:
    branches: ["*"]

jobs:
  build-extern:
    name: Build `extern`
    uses: ./.github/workflows/build.yml
    with:
      package: extern
      path: pkg/extern

  test-extern:
    name: Test `extern`
    uses: ./.github/workflows/test.yml
    needs: [build-extern]
    permissions:
      actions: read
    with:
      package: extern
      path: pkg/extern
      build-run-id: ${{ needs.build-extern.outputs.run-id }}

  build-extern-extension-fabricator-v0:
    name: Build `extern-extension-fabricator-v0`
    uses: ./.github/workflows/build.yml
    needs: [build-extern]
    with:
      package: extern-extension-fabricator-v0
      path: pkg/extern-extension-fabricator-v0

  test-extern-extension-fabricator-v0:
    name: Test `extern-extension-fabricator-v0`
    uses: ./.github/workflows/test.yml
    needs: [build-extern-extension-fabricator-v0]
    permissions:
      actions: read
    with:
      package: extern-extension-fabricator-v0
      path: pkg/extern-extension-fabricator-v0
      build-run-id: ${{ needs.build-extern-extension-fabricator-v0.outputs.run-id }}
